    # Comando Join
    join-usage: "&cUso: /hordes join <arena>"
    join-success: "&a¡Te has unido a la arena exitosamente!"
    join-failed: "&cNo se pudo unir a la arena. Verifica los requisitos."

    # Comando Leave
    leave-not-in-arena: "&c¡No estás en una arena!"
    leave-success: "&aHas abandonado la arena."

    # Comando List
    list-empty: "&cNo hay arenas disponibles."
    list-header: "&e&l--- Arenas Disponibles ---"
    list-format: "&7- &e{0} &7({1}) - &a{2}&7/&a{3} &7jugadores"

    # Comando Info - Lista optimizada
    info-usage: "&cUso: /hordes info <arena>"
    info:
      - "&e&l▬▬▬▬▬▬▬▬ &6Arena: {0} &e▬▬▬▬▬▬▬▬"
      - "&7Nombre Mostrado: &e{1}"
      - "&7Estado: {2}"
      - "&7Jugadores: &a{3}&7/&a{4}"
      - "&7Oleadas Totales: &e{5}"
      - "&7Modo: &e{6}"
      - "&7Progresión: &e{7}"
      - "&e&l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

    # Comando Stats - Lista optimizada
    stats-no-data: "&cNo se encontraron datos de estadísticas."
    stats-disabled:
      - "&c✘ El seguimiento de estadísticas está desactivado"
      - "&7Pide a un administrador que lo active en config.yml"
    stats:
      - "&e&l▬▬▬▬▬▬▬▬ &6&lTus Estadísticas &e&l▬▬▬▬▬▬▬▬"
      - ""
      - "&e❖ Estadísticas Globales:"
      - "  &7Completaciones: &a{0}"
      - "  &7Intentos: &e{1}"
      - "  &7Tasa de Victoria: &a{2}%"
      - ""
      - "&e❖ Estadísticas de Combate:"
      - "  &7Asesinatos: &a{3}"
      - "  &7Muertes: &c{4}"
      - "  &7Ratio K/D: &e{5}"
      - ""
      - "&e❖ Récords Personales:"
      - "  &7Oleada Más Alta: &a{6}"
      - "  &7Tiempo Más Rápido: &e{7}"
      - "  &7Tiempo Total de Juego: &e{8}"
      - "&e&l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

    # Comando Top - Lista optimizada
    top-invalid-category: "&cCategoría inválida. Usa: completions, kills, speed, winrate"
    top-no-data: "  &7Aún no hay datos disponibles"
    top-header:
      - "&e&l▬▬▬▬▬▬▬▬ &6&lTop {0} - {1} &e&l▬▬▬▬▬▬▬▬"
