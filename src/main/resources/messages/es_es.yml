    # ForceStop
    forcestop-usage: "&cUso: /hordesadmin forcestop <arena>"
    forcestop: "&aForzando parada de la arena &e{0}"
    forcestop-success: "&a✔ Arena detenida forzosamente"

    # Teleport
    tp-usage: "&cUso: /hordesadmin tp <arena>"
    tp-success: "&aTeletransportado a la arena &e{0}"

