# ============================================
# HORDES - Mensajes en Español (es_es.yml)
# ============================================
# Todos los mensajes del plugin en un solo lugar
# Soporta códigos de color (&a, &c, etc.) y colores HEX (#FF5733)
# Placeholders: {0}, {1}, {2} se reemplazan con valores
# PlaceholderAPI: %placeholder% funciona automáticamente
# ============================================

Messages:

  # ============================================
  # MENSAJES DE ARENA
  # ============================================
  arena:
    # Mensajes de Unión/Salida
    player-joined: "&a{0} &7se ha unido a la arena! &e({1}/{2})"
    already-joined: "&c¡Ya estás en una arena!"
    player-left: "&c{0} &7ha abandonado la arena. &e({1}/{2})"

    # Mensajes de Estado
    not-joinable: "&cEsta arena no está disponible en este momento."
    disabled: "&cEsta arena está desactivada actualmente."
    full: "&c¡Esta arena está llena!"
    no-permission: "&cNo tienes permiso para unirte a esta arena."

    # Mensajes de Cuenta Atrás
    countdown: "&eLa arena comienza en &a{0} &esegundos..."
    countdown-cancelled: "&cCuenta atrás cancelada - no hay suficientes jugadores."

    # Mensajes de Inicio/Fin
    started: "&a&l¡La arena ha comenzado! ¡Buena suerte!"
    victory: "&a&l✔ ¡VICTORIA! &7Completaste la arena en &e{0}s"
    defeat: "&c&l✘ ¡DERROTA! &7Sobreviviste por &e{0}s"

    # Mensajes de Oleada
    wave-starting: "&e&lOleada {0}/{1} &7está comenzando..."
    wave-completed: "&a&l¡Oleada {0} completada! &7(&e{1}s&7)"
    all-spawned: "&7¡Todos los enemigos han aparecido para esta oleada!"
    progress: "&e{0}/{1} &7enemigos restantes"
    next-wave-in: "&eSiguiente oleada en &a{0} &esegundos..."
    waiting-for-progression: "&e¡Todos los enemigos derrotados! &aInteractúa con el botón para continuar."

    # Mensajes de Muerte del Jugador
    player-died: "&c¡{0} ha muerto! &e({1} &7jugadores restantes&e)"
    death-kicked: "&cHas sido eliminado de la arena."
    death-spectate: "&eAhora estás espectando. Usa &a/hordes leave &epara salir."
    death-rejoin: "&ePuedes volver a unirte en &a{0} &esegundos."
    death-respawned: "&a¡Has reaparecido!"

    # Mensajes de Enfriamiento
    cooldown: "&cDebes esperar &e{0} &cantes de unirte a otra arena."

    # Mensajes de Restricción
    cannot-drop-items: "&c¡No puedes soltar objetos en la arena!"
    cannot-pickup-items: "&c¡No puedes recoger objetos en la arena!"
    cannot-teleport: "&c¡No puedes teletransportarte mientras estás en una arena!"
    cannot-use-command: "&c¡No puedes usar ese comando en la arena!"
    cannot-leave-area: "&c&l✖ ¡No puedes salir del área de la arena durante el combate!"

    # Enfriamientos específicos
    arena-cooldown: "&cDebes esperar &e{0} &cantes de volver a unirte a &6{1}"
    global-cooldown: "&c&l⏱ ¡Enfriamiento global activo! Espera &e{0}"
    temp-cooldown: "&ePuedes volver a unirte en &a{0}"
    returned-to-arena: "&e⚠ Has sido devuelto a la arena"

    # Notificaciones de combate
    kill-notification: "&7+1 Asesinato &e({0}/{1} enemigos restantes)"
    killstreak-5: "&a&l⚡ ¡RACHA DE 5 ASESINATOS!"
    killstreak-10: "&6&l⚡ ¡RACHA DE 10 ASESINATOS!"
    killstreak-15: "&c&l⚡ ¡RACHA DE 15 ASESINATOS!"
    killstreak-20: "&4&l⚡ ¡RACHA DE 20 ASESINATOS!"
    killstreak-mega: "&d&l⚡ ¡MEGA RACHA DE ASESINATOS! &e({0} asesinatos)"

  # ============================================
  # MENSAJES DE OLEADA
  # ============================================
  wave:
    starting: "&e&l¡Oleada {0} &7está comenzando..."
    completed: "&a&l¡Oleada {0} &7completada!"
    all-spawned: "&7¡Todos los enemigos han aparecido!"
    next-wave-in: "&eSiguiente oleada en &a{0} &esegundos..."
    waiting-for-progression: "&e¡Derrota a todos los enemigos para continuar!"

