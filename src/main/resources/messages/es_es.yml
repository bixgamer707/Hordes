  # ============================================
  # COMANDOS DE ADMINISTRADOR - Lista optimizada
  # ============================================
  admin:
    # Ayuda
    help:
      - "&c&l▬▬▬▬▬▬▬ &4&lComandos de Admin de Hordes &c&l▬▬▬▬▬▬▬"
      - "&a/hordesadmin reload &7- Recargar configuraciones"
      - "&a/hordesadmin create <arena> &7- Asistente para crear arena"
      - "&a/hordesadmin delete <arena> &7- Eliminar arena"
      - "&a/hordesadmin setspawn <arena> <tipo> &7- Establecer punto de aparición"
      - "&a/hordesadmin forcestart <arena> &7- Forzar inicio de arena"
      - "&a/hordesadmin forcestop <arena> &7- Forzar parada de arena"
      - "&a/hordesadmin tp <arena> &7- Teletransportarse a la arena"
      - "&a/hordesadmin debug &7- Mostrar información de depuración"
