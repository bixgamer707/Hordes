      - "  &7X: &e{3}"
      - "  &7Y: &e{4}"
      - "  &7Z: &e{5}"
      - "  &7Yaw: &e{6}"
      - "  &7Pitch: &e{7}"
      - ""
      - "&e&l⚠ Importante:"
      - "&7Esto se guardó en &earenas.yml"
      - "&7Ejecuta &a/hordesadmin reload &7para aplicar cambios"
